<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">FormFlow Studio</title>
  <desc id="desc">Local-first visual Angular form builder with a three-panel editor preview.</desc>
  <defs>
    <linearGradient id="background" x1="66" y1="12" x2="1190" y2="438" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827" />
      <stop offset=".5" stop-color="#312e81" />
      <stop offset="1" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#818cf8" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#090e20" flood-opacity=".36" />
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0v28" fill="none" stroke="#fff" stroke-opacity=".045" />
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="26" fill="url(#background)" />
  <rect width="1280" height="420" rx="26" fill="url(#grid)" />
  <circle cx="1150" cy="8" r="210" fill="#38bdf8" opacity=".09" />
  <circle cx="100" cy="420" r="190" fill="#a78bfa" opacity=".11" />

  <g transform="translate(78 76)">
