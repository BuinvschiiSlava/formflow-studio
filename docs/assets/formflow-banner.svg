    <text x="68" y="37" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750" letter-spacing="-.8">FormFlow <tspan fill="#c4b5fd">Studio</tspan></text>
  </g>
  <text x="78" y="187" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="750" letter-spacing="-1.4">Design dynamic forms visually.</text>
  <text x="78" y="226" fill="#c7d2fe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Build · validate · preview · export</text>
  <g transform="translate(78 266)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650">
