version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
      formly:
        patterns:
          - '@ngx-formly/*'
      development-tools:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Angular 22 supports TypeScript 6.x. Keep automated updates within the
      # compatible compiler major and review the TypeScript 7 migration together
      # with a future Angular major upgrade.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - dependencies
      - ci
