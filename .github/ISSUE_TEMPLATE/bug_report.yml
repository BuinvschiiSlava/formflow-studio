name: Bug report
description: Report reproducible incorrect behavior in FormFlow Studio.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include secrets or sensitive form data.
        Report security vulnerabilities privately according to SECURITY.md.

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, commit, or live demo date.
      placeholder: v1.0.0 or commit SHA
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Builder canvas
        - Property inspector
        - Form preview
        - JSON import/export
        - Persistence
        - Accessibility
        - Deployment
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest repeatable sequence.
      placeholder: |
        1. Open ...
        2. Add ...
        3. Select ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 141, Windows 11
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add console output, screenshots, or a sanitized JSON fixture.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing issue.
          required: true
        - label: I removed secrets and personal data from the report.
          required: true
        - label: This is not a security vulnerability.
          required: true
