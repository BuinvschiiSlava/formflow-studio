name: Feature request
description: Propose a focused improvement to FormFlow Studio.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today, and for whom?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior rather than an implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: schema
    attributes:
      label: Does this change exported JSON?
      options:
        - 'No'
        - 'Yes'
        - 'Not sure'
    validations:
      required: true

  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility considerations
      description: Describe keyboard, focus, screen-reader, and responsive behavior.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing request.
          required: true
        - label: The request describes one focused capability.
          required: true
